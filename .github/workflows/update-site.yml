name: Update totals and publish site

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past
  push:
    branches: [main]
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the Enthuse pages
        id: update
        continue-on-error: true
        run: |
          node scripts/update.mjs
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Save new totals to the repo
        if: steps.update.outcome == 'success'
        run: |
          if ! git diff --quiet -- data.json; then
            git config user.name "kili-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update fundraising totals"
            git push
          fi

      - name: Build the site
        env:
          CHECKED_AT: ${{ steps.update.outputs.checked_at }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

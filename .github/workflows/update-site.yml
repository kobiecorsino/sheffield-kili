name: Publish site

# Enthuse blocks GitHub's servers (Cloudflare bot protection), so totals are read
# from a browser on Kobie's computer by an hourly Claude task, which commits
# data.json. Every push to main rebuilds and republishes the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site
        run: |
          node scripts/build.mjs
          node -e 'const d=require("./data.json");const t=Object.values(d.people).reduce((s,p)=>s+p.raised,0);console.log(`Last checked: ${d.checkedAt||d.updatedAt}\nLast change: ${d.updatedAt}\nTotal raised: £${t}\nSupporter messages: ${d.wall.length}`)' > _site/status.txt
          cat _site/status.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
